[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-retention-copilot"
version = "0.4.0"
description = "Auditable strategist/critic copilot for driver retention decisions"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.18,<1.0",
  "typer>=0.15,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
ai = ["openai>=2.0,<3.0"]
pdf = ["pypdf>=5.0,<7.0"]
ui = ["streamlit>=1.45,<2.0"]
dev = [
  "bandit>=1.8,<2.0",
  "mypy>=1.15,<2.0",
  "pip-audit>=2.8,<3.0",
  "pre-commit>=4.2,<5.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.11,<1.0",
]

[project.scripts]
driver-copilot = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: tests exercising multiple application layers",
  "contract: schema and boundary contract tests",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "app/ui/streamlit_app.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["app/ui/streamlit_app.py"]

[[tool.mypy.overrides]]
module = ["pypdf.*", "streamlit.*", "openai.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
