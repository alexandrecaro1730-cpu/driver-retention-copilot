name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pdf]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy app
      - run: python -m scripts.reviewer_demo
      - run: python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - if: matrix.python-version == '3.12'
        run: python -m bandit -q -r app
      - if: matrix.python-version == '3.12'
        run: python -m pip_audit
